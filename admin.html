<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6EE;--ink:#2B3445;--mute:#6A6F78;--teal:#3F6C95;--sage:#EAF0F2;--peach:#FBEBC8;--apricot:#F2A93B;--line:#E6DECF;--red:#B3402E;--green:#2F7A57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 90px}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}
h1{font-size:28px}h2{font-size:22px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top .row{margin:0}
.card{background:#fff;border-radius:22px;padding:26px;margin-bottom:22px;box-shadow:0 8px 28px rgba(43,52,69,.06)}
.muted{color:var(--mute);font-size:14.5px}
p{margin:6px 0}
input{font:inherit;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--teal);color:#fff;border:1.5px solid var(--teal);border-radius:999px;min-height:44px;padding:9px 22px;font-weight:600}
.btn.alt{background:#fff;color:var(--teal)}
.btn.warn{background:#fff;color:var(--red);border-color:#E2BDB5}
.btn.go{background:var(--apricot);border-color:var(--apricot);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;margin-bottom:22px;box-shadow:0 4px 14px rgba(43,52,69,.06)}
.tab{flex:1;border:0;background:transparent;color:var(--mute);font-weight:600;min-height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--teal);color:#fff}
.count{background:var(--apricot);color:var(--ink);border-radius:999px;font-size:13px;font-weight:700;padding:0 9px;min-width:22px;text-align:center}
.step{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:24px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:14px;min-height:46px;padding:8px 18px;font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.lock{background:var(--peach);border:1.5px dashed var(--apricot);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.datehead{font-size:17px;margin:26px 0 10px;color:var(--teal)}
.datehead:first-child{margin-top:0}
.bk{background:var(--bg);border-radius:16px;padding:16px 18px;margin-bottom:12px;border-left:5px solid var(--line)}
.bk.pending{border-left-color:var(--apricot);background:#FFFAEF}
.bk.ok{border-left-color:var(--green)}
.bk .time{font-weight:700;font-size:17px}
.bk .who{font-size:16px;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 11px;border-radius:999px;margin-left:8px;background:var(--peach);color:#7A5A0E;vertical-align:2px}
.tag.ok{background:#DDF0E6;color:#1E5A41}.tag.blk{background:#E8EEED;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.pill{display:inline-flex;align-items:center;min-height:38px;padding:4px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--teal);font-weight:600;font-size:14.5px;text-decoration:none}
.pill:hover{border-color:var(--teal)}
.bk .row{margin:10px 0 0}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;box-shadow:0 12px 30px rgba(43,52,69,.3);max-width:92vw;text-align:center}
#mode{font-weight:600;color:var(--teal)}
#login{max-width:400px;margin:12vh auto 0}
.ov{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin:0}
.ov:first-child{border-top:0}
.ov .grow{flex:1}
[hidden]{display:none!important}
@media (max-width:520px){.card{padding:20px}.wrap{padding:18px 14px 90px}h1{font-size:24px}}
</style></head><body>
<div class="wrap">

<div id="login" class="card">
  <h1>Admin</h1>
  <p class="muted" id="loginHelp">We will email a 6-digit code to your own email address.</p>
  <div class="row" id="step1"><button class="btn" id="sendCode">Email me a code</button></div>
  <div class="row" id="step2" hidden><input id="pw" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="flex:1"><button class="btn" id="go">Open</button></div>
  <p id="loginErr" class="muted" style="color:var(--red)"></p>
</div>

<div id="app" hidden>
  <div class="top"><h1>Your sessions</h1><div class="row"><button class="btn alt" id="refresh">Refresh</button><button class="btn alt" id="out">Sign out</button></div></div>
  <div id="msg" hidden role="status"></div>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabBk" role="tab" aria-selected="true" type="button">Bookings <span class="count" id="pendN" hidden></span></button>
    <button class="tab" id="tabAv" role="tab" aria-selected="false" type="button">My availability</button>
  </div>

  <section id="paneBk"><div class="card"><div id="bk"></div></div></section>

  <section id="paneAv" hidden>
    <div class="card">
      <h2>Change a day's times</h2>
      <p class="muted">The public booking page updates straight away when you save.</p>
      <p class="step">1. Pick a day</p>
      <div class="row"><input type="date" id="day"><button class="btn alt" id="tomorrow">Tomorrow</button></div>
      <p class="muted"><span id="mode"></span></p>
      <p class="step">2. Switch times on or off</p>
      <div class="chips" id="chips"></div>
      <div class="legend"><span><i style="background:var(--teal)"></i>Available</span><span><i style="background:#fff;border:1.5px solid var(--line)"></i>Off</span><span><i style="background:var(--peach);border:1.5px dashed var(--apricot)"></i>Booked (cancel the booking to free it)</span></div>
      <div class="row"><input type="time" id="newT"><button class="btn alt" id="addT">Add this time</button></div>
      <p class="step">3. Save</p>
      <div class="row"><button class="btn go" id="save">Save this day</button><button class="btn warn" id="close">Close whole day</button><button class="btn alt" id="reset">Back to normal</button></div>
    </div>
    <div class="card"><h2>Days you have changed</h2><div id="ov"></div></div>
  </section>
</div>
</div>

<script>
const URL_="https://script.google.com/macros/s/AKfycbxO49CC4GKU1g-YB6GkjRxyHvP8yz1fwgNfJo95B4WB47eCtPxZYljBBfW_PPQMiHpF/exec";
const DEFAULT_TIMES=["10:00 AM","2:00 PM","4:00 PM","8:00 PM"];   // keep the same as your weekly times in index.html
const $=id=>document.getElementById(id);
let pass=sessionStorage.getItem("ap")||"", data={bookings:[],overrides:[],today:""}, sel=new Set(), extra=new Set(), tm;

function el(t,c,txt){const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}
function mins(t){const m=t.match(/^(\d{1,2}):(\d{2}) (AM|PM)$/); return m?((+m[1]%12)+(m[3]==="PM"?12:0))*60+ +m[2]:0;}
function pretty(s){const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});}
function addDay(s,n){const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);}
function msg(t){const m=$("msg"); m.textContent=t; m.hidden=false; clearTimeout(tm); tm=setTimeout(()=>m.hidden=true,6000);}

async function api(action,body){
  const r=await fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action:action,token:pass},body||{}))});
  return r.json();
}
function signOut(note){pass=""; sessionStorage.removeItem("ap"); $("app").hidden=true; $("login").hidden=false; $("loginErr").textContent=note||"";
  $("step2").hidden=true; $("loginHelp").textContent="We will email a 6-digit code to your own email address."; $("sendCode").disabled=false;}

async function refresh(){
  let r;
  try{ r=await api("admin_list"); }catch(e){ msg("Could not reach the booking service. Check your internet and try again."); return false; }
  if(!r||r.ok!==true){
    if(r&&r.error==="auth") signOut("Your session ended. Please sign in again.");
    else if(r&&r.error==="locked") signOut("Too many wrong attempts. Please wait 15 minutes.");
    else msg("Something went wrong loading your data.");
    return false;
  }
  data=r; $("login").hidden=true; $("app").hidden=false;
  $("day").min=data.today; if(!$("day").value||$("day").value<data.today) $("day").value=addDay(data.today,1);
  renderBookings(); renderOverrides(); loadDay(); return true;
}

/* ----- day editor ----- */
function bookedFor(date){return data.bookings.filter(b=>b.date===date&&b.status.toLowerCase()!=="blocked").map(b=>b.time);}
function loadDay(){
  const date=$("day").value; if(!date) return;
  const o=data.overrides.find(x=>x.date===date); extra=new Set();
  if(o&&o.closed){sel=new Set(); $("mode").textContent="Currently: closed all day";}
  else if(o){sel=new Set(o.times); o.times.forEach(t=>{if(!DEFAULT_TIMES.includes(t)) extra.add(t);}); $("mode").textContent="Currently: your own times";}
  else{sel=new Set(DEFAULT_TIMES); $("mode").textContent="Currently: normal weekly times";}
  renderChips();
}
function renderChips(){
  const date=$("day").value, booked=bookedFor(date), box=$("chips"); box.innerHTML="";
  [...new Set([...DEFAULT_TIMES,...extra,...sel,...booked])].sort((a,b)=>mins(a)-mins(b)).forEach(t=>{
    const isB=booked.includes(t), b=el("button","chip"+(sel.has(t)||isB?" on":"")+(isB?" lock":""),t+(isB?" · booked":""));
    b.type="button";
    b.onclick=()=>{ if(isB){msg("This time has a booking. Cancel the booking below to free it.");return;} sel.has(t)?sel.delete(t):sel.add(t); renderChips(); };
    box.appendChild(b);
  });
}
$("day").onchange=loadDay;
$("tomorrow").onclick=()=>{$("day").value=addDay(data.today,1); loadDay();};
$("addT").onclick=()=>{
  const v=$("newT").value; if(!v) return;
  const [h,m]=v.split(":").map(Number), t=((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM");
  extra.add(t); sel.add(t); $("newT").value=""; renderChips();
};
async function saveDay(mode){
  const date=$("day").value; if(!date) return;
  const bk=bookedFor(date), times=[...new Set([...sel,...bk])];
  if(mode==="custom"){
    if(!times.length){msg("Pick at least one time, or use Close whole day."); return;}
    if(times.length===DEFAULT_TIMES.length&&DEFAULT_TIMES.every(t=>times.includes(t))) mode="default";
  }
  if(mode==="closed"&&bk.length&&!confirm("This day already has booking(s). Closing hides the day from new bookings but does not cancel them. Continue?")) return;
  let r; try{ r=await api("admin_set_day",{date:date,mode:mode,times:times}); }catch(e){ msg("Could not reach the booking service."); return; }
  if(!r||!r.ok){ msg("Could not save. Please try again."); return; }
  msg(pretty(date)+": "+(mode==="closed"?"closed.":mode==="default"?"back to normal times.":"saved."));
  await refresh();
}
$("save").onclick=()=>saveDay("custom");
$("close").onclick=()=>saveDay("closed");
$("reset").onclick=()=>saveDay("default");

function renderOverrides(){
  const box=$("ov"); box.innerHTML="";
  if(!data.overrides.length){box.appendChild(el("p","muted","None. Every day uses your normal weekly times."));return;}
  data.overrides.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(o=>{
    const r=el("div","ov"), g=el("div","grow"); g.appendChild(el("strong",null,pretty(o.date))); g.appendChild(el("div","muted",o.closed?"Closed all day":o.times.join(", "))); r.appendChild(g);
    const e=el("button","btn alt","Edit"); e.onclick=()=>{$("day").value=o.date; loadDay(); window.scrollTo({top:0,behavior:"smooth"});};
    r.appendChild(e); box.appendChild(r);
  });
}

/* ----- bookings ----- */
function renderBookings(){
  const box=$("bk"); box.innerHTML="";
  const list=data.bookings.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:mins(a.time)-mins(b.time));
  const pend=list.filter(b=>{const x=b.status.toLowerCase();return x!=="confirmed"&&x!=="blocked";}).length;
  const pn=$("pendN"); pn.textContent=pend; pn.hidden=!pend;
  if(!list.length){box.appendChild(el("p","muted","No upcoming bookings."));return;}
  let last="";
  list.forEach(b=>{
    if(b.date!==last){last=b.date; box.appendChild(el("h3","datehead",pretty(b.date)));}
    const st=b.status.toLowerCase(), c=el("div","bk"+(st==="confirmed"?" ok":st==="blocked"?"":" pending")), head=el("div");
    head.appendChild(el("span","time",b.time));
    head.appendChild(el("span","tag"+(st==="confirmed"?" ok":st==="blocked"?" blk":""),b.status||"Pending"));
    c.appendChild(head);
    if(st==="blocked") c.appendChild(el("div","muted","Time blocked by you"));
    else{
      c.appendChild(el("div","who",b.name));
      const links=el("div","pills"), d10=b.phone.replace(/\D/g,"").slice(-10);
      const add=(t,h,ext)=>{const a=el("a","pill",t); a.href=h; if(ext){a.target="_blank"; a.rel="noopener";} links.appendChild(a);};
      if(d10.length===10){add("WhatsApp","https://wa.me/91"+d10,true); add("Call","tel:+91"+d10);}
      else if(b.phone) links.appendChild(el("span","muted",b.phone));
      if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email)) add("Email","mailto:"+b.email);
      if(b.meet.indexOf("https://meet.google.com/")===0) add("Meet link",b.meet,true);
      c.appendChild(links);
      if(b.confirmation) c.appendChild(el("div","muted","Confirmation: "+b.confirmation));
    }
    const row=el("div","row");
    if(st!=="confirmed"&&st!=="blocked"){const y=el("button","btn go","Confirm and send link"); y.onclick=()=>setStatus(b,"Confirmed"); row.appendChild(y);}
    const n=el("button","btn warn",st==="blocked"?"Unblock":"Cancel"); n.onclick=()=>setStatus(b,"Cancelled"); row.appendChild(n);
    c.appendChild(row); box.appendChild(c);
  });
}
async function setStatus(b,status){
  if(status==="Cancelled"&&b.status.toLowerCase()!=="blocked"&&!confirm("Cancel this booking and free the time? The client is not emailed automatically, so please message them on WhatsApp.")) return;
  let r; try{ r=await api("admin_set_status",{row:b.row,date:b.date,time:b.time,status:status}); }catch(e){ msg("Could not reach the booking service."); return; }
  if(!r||!r.ok) msg(r&&r.error==="stale"?"The sheet changed in the meantime. Refreshed, please try again.":"Something went wrong.");
  else if(status==="Confirmed") msg(/^Sent/.test(r.confirmation)?"Confirmed. Meet link emailed to the client.":"Confirmed, but: "+r.confirmation);
  else msg("Cancelled. The time is free again.");
  await refresh();
}

/* ----- login ----- */
async function sendCode(){
  $("loginErr").textContent=""; $("sendCode").disabled=true;
  let r; try{ r=await api("admin_request_code"); }catch(e){ $("loginErr").textContent="Could not reach the booking service."; $("sendCode").disabled=false; return; }
  if(r&&r.ok){ $("loginHelp").textContent="Code sent. Check your email (and spam). It works for 10 minutes."; $("step2").hidden=false; $("pw").focus(); setTimeout(()=>{$("sendCode").disabled=false; $("sendCode").textContent="Send a new code";},60000); }
  else{ $("loginErr").textContent=(r&&r.error==="wait")?"A code was just sent. Please wait a minute before asking again.":"Could not send the code. Please try again."; $("sendCode").disabled=false; }
}
async function login(){
  const code=$("pw").value.replace(/\D/g,"");
  if(code.length!==6){ $("loginErr").textContent="Please type the 6 digits from the email."; return; }
  $("loginErr").textContent="";
  let r; try{ r=await api("admin_verify_code",{code:code}); }catch(e){ $("loginErr").textContent="Could not reach the booking service."; return; }
  $("pw").value="";
  if(r&&r.ok&&r.token){ pass=r.token; sessionStorage.setItem("ap",pass); await refresh(); }
  else if(r&&r.error==="locked") $("loginErr").textContent="Too many wrong attempts. Please wait 15 minutes.";
  else $("loginErr").textContent="That code was not right or has expired. Ask for a new one.";
}
$("sendCode").onclick=sendCode;
$("go").onclick=login; $("pw").addEventListener("keydown",e=>{if(e.key==="Enter") login();});
$("refresh").onclick=refresh; $("out").onclick=()=>{api("admin_logout").catch(()=>{}); signOut("");};
function tab(n){const b=n==="bk";$("paneBk").hidden=!b;$("paneAv").hidden=b;$("tabBk").classList.toggle("on",b);$("tabAv").classList.toggle("on",!b);$("tabBk").setAttribute("aria-selected",b);$("tabAv").setAttribute("aria-selected",!b);}
$("tabBk").onclick=()=>tab("bk"); $("tabAv").onclick=()=>tab("av");
if(pass) refresh();
</script>
</body></html>
